            <!-- TAB: MAPA UNIFICADO (SISTEMA DE INFORMACIÓN GEOSISTÉMICO Y C4ISR) -->
            <div id="tab-map" class="tab-content" style="position:relative; width:100%; height:calc(100vh - 120px); min-height:600px; border-radius:12px; overflow:hidden; border:1px solid rgba(0,229,255,0.2);">
                
                <!-- MAPA LEAFLET BASE -->
                <div id="unified-map-container" style="position:absolute; inset:0; z-index:1;"></div>

                <!-- FLOATING TOP HUD & CONTROL BAR -->
                <div class="map-hud-top flex-between flex-wrap gap-1" style="position:absolute; top:14px; left:14px; right:300px; z-index:1000; pointer-events:none;">
                    
                    <!-- Presets de Teatro Táctico y Búsqueda -->
                    <div class="flex items-center gap-05 flex-wrap" style="pointer-events:auto;">
                        <div class="map-hud-chip flex items-center gap-05 p-1 rounded-lg" style="background:rgba(10,12,18,0.9); border:1px solid rgba(0,229,255,0.3); backdrop-filter:blur(12px);">
                            <span class="text-primary font-mono text-xs font-bold">TEATRO:</span>
                            <button type="button" class="btn-tactical text-xs" onclick="window.UnifiedMap.flyToTheater('COL')" title="Enfocar República de Colombia">🇨🇴 COL</button>
                            <button type="button" class="btn-tactical text-xs" onclick="window.UnifiedMap.flyToTheater('VEN')" title="Enfocar República Bolivariana de Venezuela">🇻🇪 VEN</button>
                            <button type="button" class="btn-tactical text-xs" onclick="window.UnifiedMap.flyToTheater('BORDER')" title="Enfocar Zona Fronteriza Arauca-Apure-Cúcuta">⚔️ FRONTERA</button>
                            <button type="button" class="btn-tactical text-xs" onclick="window.UnifiedMap.flyToTheater('GLOBAL')" title="Vista Global de Teatros">🌐 GLOBAL</button>
                        </div>

                        <!-- Buscador de Vectores dentro del Mapa -->
                        <div class="map-hud-chip flex items-center gap-05 p-1 rounded-lg" style="background:rgba(10,12,18,0.9); border:1px solid rgba(0,229,255,0.3); backdrop-filter:blur(12px);">
                            <input type="text" id="map-search-input" class="sitrep-search-input text-xs" placeholder="🔍 Buscar vector o evento..." style="width:170px; background:transparent; border:none; color:#fff;" onkeyup="if(event.key==='Enter')window.UnifiedMap.searchVector(this.value)">
                            <button class="btn-tactical text-xs" onclick="window.UnifiedMap.searchVector(document.getElementById('map-search-input').value)">Buscar</button>
                        </div>
                    </div>

                    <!-- Selector de Capas Base (Basemaps) y KPI -->
                    <div class="flex items-center gap-05" style="pointer-events:auto;">
                        <div class="map-hud-chip flex items-center gap-05 p-1 rounded-lg" style="background:rgba(10,12,18,0.9); border:1px solid rgba(0,229,255,0.3); backdrop-filter:blur(12px);">
                            <span class="text-muted font-mono text-xs">CAPA BASE:</span>
                            <select id="map-basemap-select" onchange="window.UnifiedMap.switchBasemap(this.value)" class="sitrep-select text-xs" style="background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.1); border-radius:4px; padding:3px 6px;">
                                <option value="dark">🌑 CartoDB Dark (Ciberpunk)</option>
                                <option value="satellite">🛰️ Satélite HD (Esri World)</option>
                                <option value="light">☀️ Táctico Claro (CartoDB Light)</option>
                            </select>
                        </div>

                        <div class="map-hud-chip flex items-center gap-05 p-1 rounded-lg" style="background:rgba(10,12,18,0.9); border:1px solid rgba(0,229,255,0.3); backdrop-filter:blur(12px);">
                            <span class="pulse-dot-green">●</span>
                            <span class="font-mono text-xs text-primary font-bold" id="map-hud-marker-count">0 VECTORES</span>
                        </div>
                    </div>
                </div>

                <!-- PANEL LATERAL DE CAPAS FLOTANTE -->
                <div id="unified-layer-panel" style="position:absolute; top:14px; right:14px; width:270px; max-height:calc(100% - 65px); background:rgba(10,12,18,0.92); border:1px solid rgba(0,229,255,0.3); border-radius:14px; padding:14px; overflow-y:auto; font-family:'Roboto Mono',monospace; z-index:1000; backdrop-filter:blur(16px); box-shadow:0 10px 30px rgba(0,0,0,0.7), 0 0 15px rgba(0,229,255,0.1);">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.08);">
                        <div class="flex items-center gap-05">
                            <span style="color:var(--primary); font-weight:bold; font-size:0.8rem; letter-spacing:1px;">🗺️ CAPAS DE INTELIGENCIA</span>
                        </div>
                        <span id="unified-layer-count" class="config-chip" style="font-size:0.65rem; background:rgba(0,229,255,0.15); color:var(--primary);">0/0</span>
                    </div>

                    <div id="unified-layer-list" style="display:flex; flex-direction:column; gap:4px;"></div>

                    <div style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:6px;">
                        <div class="flex gap-05">
                            <button onclick="if(window.UnifiedMap)window.UnifiedMap.selectAllLayers(true)" class="btn-tactical text-xs" style="flex:1;">Seleccionar Todas</button>
                            <button onclick="if(window.UnifiedMap)window.UnifiedMap.selectAllLayers(false)" class="btn-tactical text-xs" style="flex:1;">Limpiar</button>
                        </div>
                        <button onclick="if(window.UnifiedMap)window.UnifiedMap.refreshAll()" class="btn-tactical" style="width:100%; background:linear-gradient(135deg, rgba(0,229,255,0.2) 0%, rgba(179,136,255,0.2) 100%); border-color:var(--primary); color:#fff; font-weight:bold; padding:8px; font-size:0.75rem;">
                            ⟳ REFRESCAR CAPAS
                        </button>
                    </div>
                </div>

                <!-- FLOATING BOTTOM TELEMETRY BAR -->
                <div id="map-telemetry-bar" style="position:absolute; bottom:14px; left:14px; z-index:1000; background:rgba(10,12,18,0.9); border:1px solid rgba(0,229,255,0.3); border-radius:8px; padding:6px 12px; font-family:'Roboto Mono',monospace; font-size:0.7rem; color:#E2E8F0; display:flex; items-center:center; gap:12px; backdrop-filter:blur(12px);">
                    <span class="flex items-center gap-05"><span class="text-muted">COORD:</span> <strong id="map-telemetry-coords" class="text-primary">06.5000° N, -70.0000° W</strong></span>
                    <span class="flex items-center gap-05"><span class="text-muted">ZOOM:</span> <strong id="map-telemetry-zoom" class="text-white">5.0x</strong></span>
                    <span class="flex items-center gap-05"><span class="text-muted">ESTADO OSIRIS:</span> <strong class="text-primary">ONLINE</strong></span>
                </div>

                <!-- LOADING OVERLAY -->
                <div id="unified-map-loading" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-family:'Roboto Mono',monospace; font-size:0.85rem; display:none; z-index:1001; background:rgba(10,12,18,0.92); padding:16px 28px; border-radius:12px; border:1px solid var(--primary); box-shadow:0 0 25px rgba(0,229,255,0.3); backdrop-filter:blur(15px);">
                    <span style="color:var(--primary); font-weight:bold;" class="spin">⟳</span> CARGANDO DATOS GEOSISTÉMICOS...
                </div>
            </div>
