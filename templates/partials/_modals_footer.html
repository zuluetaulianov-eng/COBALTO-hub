    <!-- Inject global data for modular scripts -->
    <script>
        window._entryMaxAgeHours = {{ ENTRY_MAX_AGE_HOURS or 48 }};
        window._ownPosts = {{ own_posts|default([])|tojson }};
        window._alertData = {{ alerts|default([])|tojson }};
        window._socialGraph = {{ social_graph.graph|default({"nodes":[],"edges":[]})|tojson }};
        window._socialGraphTimestamp = "{{ social_graph.get('timestamp', '') }}";
        
        window._initialNews = {{ all_entries|default([])|tojson }};
        window._initialBriefing = {{ global_briefing|default({})|tojson }};
        window._initialSocial = {{ social_data|default({"sources":{}, "count":0, "timestamp":""})|tojson }};
        window._initialRealtime = {
            flight_data: {{ flight_data|default(None)|tojson }},
            vessel_data: {{ vessel_data|default(None)|tojson }},
            events_data: {{ events_data|default(None)|tojson }},
            open_data: {{ open_data|default(None)|tojson }}
        };
        window._initialNarratives = {{ narrative_analysis|default({"narratives":[], "total_entries":0})|tojson }};
        window._initialMapData = {
            geo_points: {{ geo_points|default([])|tojson }},
            ai_geopoints: {{ ai_geopoints|default([])|tojson }}
        };
        window._initialStatus = {
            total_sources: {{ total_sources|default(0) }},
            total_entries: {{ all_entries|default([])|length }},
            timestamp: "{{ now }}",
            updating: {{ (updating | default(false)) | tojson }}
        };
        
        // Generar datos cibernéticos locales a partir de news y social
        (function() {
            var seen = new Set();
            var cyberItems = [];
            var news = window._initialNews || [];
            news.forEach(function(item) {
                var t = String(item.type || '').toLowerCase();
                var s = String(item.source || '').toLowerCase();
                var isCyber = t.indexOf('cyber_alert') !== -1 || t.indexOf('ransomware') !== -1 || t.indexOf('pastebin') !== -1 ||
                              s.indexOf('cyber') !== -1 || s.indexOf('darknet') !== -1 || s.indexOf('pastebin') !== -1 || s.indexOf('vencert') !== -1 || s.indexOf('ransomware') !== -1;
                if (isCyber) {
                    var key = (item.link || '') + '|' + (item.title || '');
                    if (!seen.has(key)) {
                        seen.add(key);
                        cyberItems.push(item);
                    }
                }
            });
            var socialSources = (window._initialSocial && window._initialSocial.sources) ? window._initialSocial.sources : {};
            for (var src in socialSources) {
                var items = socialSources[src] || [];
                items.forEach(function(item) {
                    var key = (item.link || '') + '|' + (item.title || '');
                    if (!seen.has(key)) {
                        seen.add(key);
                        var cloned = Object.assign({}, item);
                        if (!cloned.source) cloned.source = "Cyber";
                        if (!cloned.published) cloned.published = "";
                        cyberItems.push(cloned);
                    }
                });
            }
            window._initialCyber = cyberItems;
        window._startCobaltoApp = function() {
            if (window.CobaltoCore && !window._appInitialized) {
                window._appInitialized = true;
                window.CobaltoCore.init("{{ now }}");
                if (window.CobaltoLayout) window.CobaltoLayout.init();
                if (window.CobaltoMap) window.CobaltoMap.init();
                if (window.initSocialGraph) window.initSocialGraph();
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window._startCobaltoApp);
        } else {
            window._startCobaltoApp();
        }
        window.addEventListener('load', window._startCobaltoApp);

        // Fail-safe para remover splash screen si se retrasa la carga
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.transition = 'opacity 0.5s';
                splash.style.opacity = '0';
                setTimeout(function() { if (splash.parentElement) splash.parentElement.removeChild(splash); }, 600);
            }
        }, 1200);
    </script>
