<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="{{ PAGE_DESCRIPTION }}">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://server.arcgisonline.com https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: http:; media-src 'self' data: blob: https: http:; frame-src 'self' https: http:; connect-src 'self' ws: wss: https://unpkg.com https://cdn.jsdelivr.net https://server.arcgisonline.com https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com; object-src 'none'; base-uri 'none'; form-action 'self'">
    <script>
        // Performance fix for Leaflet Heatmap Canvas2D warning
        (function() {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attributes) {
                if (type === '2d') {
                    attributes = attributes || {};
                    attributes.willReadFrequently = true;
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();
    </script>
    <title>{{ PAGE_TITLE }} v16.0</title>
    <!-- Preconnect + Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
    <!-- Non-render-blocking Third Party CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" media="print" onload="this.media='all'" />
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <!-- Critical Application CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css?v={{ now|urlencode }}">
    <style>
        .splash-screen {
            position: fixed; inset: 0; z-index: 99999;
            background: #0A0B10; display: flex;
            flex-direction: column; align-items: center;
            justify-content: center; font-family: 'Roboto Mono', monospace;
        }
        .splash-screen .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #00E5FF; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 1rem; box-shadow: 0 0 30px rgba(0,229,255,0.3); }
        .splash-screen .bar { width: 160px; height: 3px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .splash-screen .bar-fill { height: 100%; width: 30%; background: #00E5FF; border-radius: 4px; animation: splashLoad 1.2s ease-in-out infinite; }
        @keyframes splashLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
    </style>
    <!-- Deferred scripts -->
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script defer src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script defer src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
    <script defer src="/static/lib/html2canvas.min.js"></script>
    <script defer src="/static/lib/vis-network.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://unpkg.com/force-graph"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- PWA y Mobile Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A0B10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="/static/icons/cobalto.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/icons/icon-144.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/icons/icon-512.png">
    <meta name="apple-mobile-web-app-title" content="Cobalto Hub">
</head>
