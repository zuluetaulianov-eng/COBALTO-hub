<div id="tab-humint" class="tab-content">
    <div class="panel-glass" style="padding: 1.5rem; margin-bottom: 1rem;">
        <div class="flex-between" style="margin-bottom: 1rem;">
            <div>
                <h2 class="heading-2">🕵️ HUMINT & Reportes de Campo</h2>
                <div class="text-muted" style="font-size: 0.75rem; margin-top: 0.2rem;">
                    Captura táctica de terreno • Sincronización Telegram / Web • Air-Gapped Resilient
                </div>
            </div>
            <div class="flex" style="gap: 0.5rem; align-items: center;">
                <span id="humint-offline-badge" class="badge" style="display:none; background:#FF9500; color:#000; font-weight:bold; font-size:0.75rem; padding: 2px 8px; border-radius: 4px;">📡 0 Pendientes Sync</span>
                <span id="humint-count" class="kpi-value" style="font-size: 1.1rem;">0</span>
                <span class="text-muted" style="font-size: 0.8rem;">reportes</span>
                <button class="btn-tactical btn-sm" onclick="HumintIntel.loadReports()">🔄 Recargar</button>
            </div>
        </div>
        <div class="flex flex-wrap gap-1" style="margin-bottom: 0.5rem;">
            <button class="btn-tactical btn-sm" data-humint-status="" onclick="HumintIntel.filterStatus('')" style="border-color:var(--primary);">Todos</button>
            <button class="btn-tactical btn-sm" data-humint-status="new" onclick="HumintIntel.filterStatus('new')">🆕 Nuevos</button>
            <button class="btn-tactical btn-sm" data-humint-status="published" onclick="HumintIntel.filterStatus('published')">📢 Publicados</button>
            <button class="btn-tactical btn-sm" data-humint-status="reviewed" onclick="HumintIntel.filterStatus('reviewed')">✅ Revisados</button>
        </div>
    </div>

    <!-- New report form -->
    <div class="panel-glass" style="padding: 1rem; margin-bottom: 1rem;">
        <div class="flex-between" style="margin-bottom: 0.5rem;">
            <div class="heading-4">📝 Nuevo Reporte de Campo</div>
            <button class="btn-tactical btn-sm" onclick="HumintIntel.addSampleReport()" style="border-color:var(--primary); font-size:0.75rem;">⚡ Cargar Ejemplo Táctico</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
            <input id="humint-title" class="config-input" placeholder="Título del reporte *" aria-label="Título del reporte HUMINT">
            <input id="humint-reporter" class="config-input" placeholder="Reportado por (ej: Agente-07)" aria-label="Informante o agente reportante">
            <input id="humint-lat" class="config-input" placeholder="Latitud (ej: 10.4806)" aria-label="Latitud de la ubicación">
            <input id="humint-lon" class="config-input" placeholder="Longitud (ej: -66.9036)" aria-label="Longitud de la ubicación">
            <input id="humint-location" class="config-input" placeholder="Nombre del lugar (ej: Sector Centro)" aria-label="Nombre del lugar del reporte">
            <select id="humint-severity" class="config-select" aria-label="Nivel de severidad del reporte HUMINT">
                <option value="info">ℹ️ Informativo</option>
                <option value="medium">🟡 Medio</option>
                <option value="high">🟠 Alto</option>
                <option value="critical">🔴 Crítico</option>
            </select>
            <input id="humint-photo" class="config-input" placeholder="URL de Foto / Evidencia (opcional)" aria-label="URL de Foto o Evidencia" style="grid-column: span 2;">
            <input id="humint-tags" class="config-input" placeholder="Tags (ej: patrullaje, movilizacion, vehicular)" aria-label="Etiquetas del reporte" style="grid-column: span 2;">
        </div>
        <textarea id="humint-description" class="config-input" style="width:100%;min-height:80px;margin-top:0.5rem;" placeholder="Descripción detallada de la novedad en terreno..." aria-label="Descripción detallada del reporte HUMINT"></textarea>
        <div class="flex-between" style="margin-top:0.5rem;">
            <button class="btn-tactical" onclick="HumintIntel.submitReport()">📤 Enviar Reporte de Campo</button>
            <span class="text-muted font-mono" style="font-size:0.7rem;">Soporta captura en modo desconectado (Offline Queue)</span>
        </div>
    </div>

    <!-- Report list -->
    <div id="humint-report-list">
        <div class="empty-state">
            <div style="font-size:2rem;">🕵️</div>
            <div class="heading-4">Cargando reportes...</div>
        </div>
    </div>
</div>
