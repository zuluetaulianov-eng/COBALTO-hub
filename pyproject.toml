[project]
name = "cobalto-hub"
version = "9.1.0"
description = "OSINT Intelligence Platform focused on Venezuela"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.46.0",
    "jinja2>=3.1.6",
    "pydantic>=2.0.0",
    "groq>=1.2.0",
    "google-generativeai>=0.8.6",
    "aiohttp>=3.13.5",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.14.3",
    "playwright>=1.59.0",
    "python-dotenv>=1.2.2",
    "prometheus-client>=0.25.0",
    "docxtpl>=0.20.0",
    "python-docx>=1.2.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
    "pystray>=0.19.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "crawl4ai-main",
    "sistema inteligente",
    "BOTDOCUMENTO",
    "Ollama_Interfaz_Windows CON REPORTE",
    "deprecated_social",
    "scratch",
    "scripts",
    "cobalto_mobile",
    "dist_nuitka",
    "dist_installer",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "F403", "F405"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
exclude = [
    "crawl4ai-main",
    "sistema inteligente",
    "BOTDOCUMENTO",
    "Ollama_Interfaz_Windows CON REPORTE",
    "deprecated_social",
    "scratch",
    "scripts",
    "cobalto_mobile",
    "dist",
    "dist_nuitka",
    "dist_installer",
    "build",
    "tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
