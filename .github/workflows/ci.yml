name: Cobalto Hub CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with Ruff
        run: ruff check .
        continue-on-error: true

      - name: Type check with mypy
        run: mypy --ignore-missing-imports --check-untyped-defs .
        continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: pytest --cov=. --cov-report=xml --cov-report=term -v
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true

  deploy-check:
    name: Import Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "
          import sys, importlib
          modules = [
              'app', 'config', 'dashboard', 'extractor', 'ai_core', 'database',
              'graph_database', 'humanization', 'security_utils', 'metrics',
              'doh_patch', 'telegrambot', 'osint_registry', 'event_radar',
              'osint_alerts', 'osint_narrative', 'osint_socialgraph',
              'osint_fakenews', 'feed_repair', 'osint_playwright',
              'user_search', 'osint_onion', 'osint_social_dorks'
          ]
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'OK: {m}')
              except Exception as e:
                  print(f'FAIL: {m} -> {e}')
          "
        continue-on-error: true
